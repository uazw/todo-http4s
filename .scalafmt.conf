version = "3.11.5"
runner.dialect = scala3
maxColumn = 120

# Braceless Scala 3 is a formatting invariant here, not a convention.
# `optionalBraces` rewrites every brace block the language lets you write with
# indentation (control structures, `match`, definition bodies, templates), and
# `fewerBraces` extends that to a trailing block argument — `test("x") { ... }`
# becomes `test("x"):`. A stray pair of braces therefore fails
# `scalafmtCheckAll`, which `auto/check` runs on every build.
#
# `fewerBraces.span.max` must be positive for that second rewrite to run at
# all; 2000 tokens is far past anything a 120-column file should hold.
rewrite.scala3.optionalBraces.enabled = true
rewrite.scala3.optionalBraces.oldSyntaxToo = true
rewrite.scala3.optionalBraces.fewerBraces.span.max = 2000

rewrite.rules = [RedundantBraces, SortModifiers]
docstrings.style = SpaceAsterisk
