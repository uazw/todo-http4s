services:
  postgres:
    image: postgres:18-alpine
    container_name: todo-postgres
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - todo-pgdata-v18:/var/lib/postgresql

volumes:
  todo-pgdata-v18:
