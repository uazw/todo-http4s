name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep logs readable: no colour codes, no supershell progress bars.
  SBT_OPTS: -Dsbt.color=false -Dsbt.supershell=false

jobs:
  check:
    name: tests + format
    # Deliberately not pinned to a dated image. GitHub has announced that
    # `ubuntu-latest` moves to Ubuntu 26 on 2026-10-19; auto/check is written for
    # both BSD and GNU userland and was verified on ubuntu:24.04, so the label
    # can migrate on its own. Pin `runs-on: ubuntu-24.04` instead if you would
    # rather control that timing.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          # Caches ~/.ivy2, ~/.sbt and ~/.cache/coursier.
          cache: sbt
          cache-dependency-path: |
            build.sbt
            project/build.properties
            project/plugins.sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Run the gate
        # Testcontainers talks to the Docker daemon already available on
        # GitHub's Ubuntu runner and owns the PostgreSQL lifecycle.
        run: ./auto/check

      - name: Stop the sbt server
        if: always()
        run: sbt -batch shutdownall || true
