# Runtime configuration for the todo service.
#
# Any value can be overridden from the environment using the `?`-suffixed
# substitutions below, e.g.
#
#   TODO_HTTP_PORT=9000 TODO_DB_PASSWORD=secret sbt run
#
todo {
  http {
    host = "0.0.0.0"
    host = ${?TODO_HTTP_HOST}
    port = 8080
    port = ${?TODO_HTTP_PORT}
  }

  database {
    host = "localhost"
    host = ${?TODO_DB_HOST}
    port = 5432
    port = ${?TODO_DB_PORT}
    name = "todo"
    name = ${?TODO_DB_NAME}
    user = "todo"
    user = ${?TODO_DB_USER}
    password = "todo"
    password = ${?TODO_DB_PASSWORD}
    pool-size = 8
    pool-size = ${?TODO_DB_POOL_SIZE}
    connection-timeout = 5s
    connection-timeout = ${?TODO_DB_CONNECTION_TIMEOUT}
  }

  # Run the bundled schema.sql on boot (idempotent DDL).
  migrate-on-start = true
  migrate-on-start = ${?TODO_MIGRATE_ON_START}
}
